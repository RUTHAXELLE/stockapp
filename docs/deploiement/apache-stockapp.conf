# ============================================================
#  Apache — ERP EMUCI (branche vps-mysql), si Apache est retenu
#  à la place de Nginx. À copier dans
#  /etc/apache2/sites-available/stockapp.conf, puis :
#    a2enmod rewrite && a2ensite stockapp && a2dissite 000-default
#    apache2ctl configtest && systemctl reload apache2
#  HTTPS : certbot --apache -d erp.digimmat.ci complète ce fichier.
# ============================================================
<VirtualHost *:80>
    ServerName erp.digimmat.ci
    DocumentRoot /var/www/stockapp

    <Directory /var/www/stockapp>
        Options -Indexes
        AllowOverride All
        Require all granted
    </Directory>

    # ── Ce qui ne doit JAMAIS être servi ──────────────────────────
    # Le .htaccess fourni ne protège que includes/, templates/, cron/ et
    # vendor/ : .env (mot de passe MySQL), .git, sql/, backups/, tools/ et
    # docs/ restaient téléchargeables.
    <DirectoryMatch "^/var/www/stockapp/(\.git|sql|tools|docs|docker|backups)(/|$)">
        Require all denied
    </DirectoryMatch>
    <FilesMatch "(^\.|\.(md|sh|ya?ml|json|lock|sql|gz|log)$|^(Dockerfile|git|migrate_site_id\.php)$)">
        Require all denied
    </FilesMatch>

    # Imports EMUCI jusqu'à 50 Mo.
    LimitRequestBody 57671680

    ErrorLog  ${APACHE_LOG_DIR}/stockapp-error.log
    CustomLog ${APACHE_LOG_DIR}/stockapp-access.log combined
</VirtualHost>
