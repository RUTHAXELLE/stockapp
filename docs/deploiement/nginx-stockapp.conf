# ============================================================
#  Nginx — ERP EMUCI (branche vps-mysql)
#  À copier dans /etc/nginx/sites-available/stockapp, puis :
#    ln -s /etc/nginx/sites-available/stockapp /etc/nginx/sites-enabled/
#    nginx -t && systemctl reload nginx
#  PHP 8.4 au lieu de 8.3 : adapter le chemin fastcgi_pass.
#  HTTPS : certbot --nginx -d erp.digimmat.ci complète ce fichier.
# ============================================================
server {
    listen 80;
    server_name erp.digimmat.ci;

    root  /var/www/stockapp;
    index index.php;

    # Imports EMUCI jusqu'à 50 Mo (aligné sur upload_max_filesize / post_max_size).
    client_max_body_size 55M;

    access_log /var/log/nginx/stockapp-access.log;
    error_log  /var/log/nginx/stockapp-error.log;

    # ── Ce qui ne doit JAMAIS être servi ──────────────────────────
    # Le code est publié tel quel : .env (mot de passe MySQL), .git,
    # scripts SQL, sauvegardes, outils et documentation sont dans le
    # même dossier que les pages. Ces règles passent avant celle du PHP.
    location ~ /\.(?!well-known/) { deny all; return 404; }
    location ~ ^/(includes|templates|cron|vendor|sql|tools|docs|docker|backups|git)(/|$) { deny all; return 404; }
    location ~ \.(md|sh|ya?ml|json|lock|sql|gz|log)$ { deny all; return 404; }
    location = /Dockerfile          { deny all; return 404; }
    location = /migrate_site_id.php { deny all; return 404; }

    # Aucun script exécutable dans les fichiers déposés par les utilisateurs.
    location ~ ^/uploads/.*\.(php\d?|phtml|pl|py|cgi|sh)$ { deny all; return 404; }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_read_timeout 300;
    }
}
