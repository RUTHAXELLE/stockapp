; ============================================================
;  PHP — réglages ERP EMUCI (branche vps-mysql)
;  À copier en 90-stockapp.ini dans le conf.d de CHAQUE interface :
;    /etc/php/8.3/fpm/conf.d/      (Nginx, ou Apache + PHP-FPM)
;    /etc/php/8.3/apache2/conf.d/  (Apache + mod_php)
;    /etc/php/8.3/cli/conf.d/      (tâches planifiées, scripts)
;  puis recharger php8.3-fpm (ou apache2).
; ============================================================

; Imports EMUCI jusqu'à 50 Mo (le serveur web est réglé à 55 Mo)
upload_max_filesize = 50M
post_max_size = 55M

; PhpSpreadsheet charge tout le classeur en mémoire ; les gros exports
; Excel/PDF peuvent dépasser les 30 s par défaut
memory_limit = 256M
max_execution_time = 300

date.timezone = Africa/Abidjan

; Production : les erreurs vont dans le journal, jamais à l'écran
display_errors = Off
log_errors = On
expose_php = Off
